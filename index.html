<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These tags are the no-JavaScript baseline. Social scrapers (Slack,
      LinkedIn, WhatsApp, X) do not execute JavaScript, so the OG card has to
      exist in the served HTML — a runtime-only head would preview as blank.

      Each one carries data-seo-static="true". On React 19, react-helmet-async
      emits its tags through React's native metadata hoisting, which appends
      rather than reconciling, so <Seo> deletes everything marked
      data-seo-static as it takes over. Without that the page would carry two
      <title>s and two canonicals. Any tag added here that <Seo> also emits
      needs the attribute.
    -->
    <title data-seo-static="true">TorkQ — AI Governance Gateway for Regulated Enterprises</title>
    <meta
      data-seo-static="true"
      name="description"
      content="TorkQ is an on-premise AI governance gateway that masks PII in prompts before they reach an LLM, controls model access, and logs a tamper-evident audit trail."
    />

    <link data-seo-static="true" rel="canonical" href="https://www.torkq.com/" />
    <meta data-seo-static="true" name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta data-seo-static="true" property="og:type" content="website" />
    <meta data-seo-static="true" property="og:site_name" content="TorkQ" />
    <meta
      data-seo-static="true"
      property="og:title"
      content="TorkQ — AI Governance Gateway for Regulated Enterprises"
    />
    <meta
      data-seo-static="true"
      property="og:description"
      content="TorkQ is an on-premise AI governance gateway that masks PII in prompts before they reach an LLM, controls model access, and logs a tamper-evident audit trail."
    />
    <meta data-seo-static="true" property="og:url" content="https://www.torkq.com/" />
    <meta data-seo-static="true" property="og:image" content="https://www.torkq.com/og-image.png" />

    <!-- Twitter -->
    <meta data-seo-static="true" name="twitter:card" content="summary_large_image" />
    <meta
      data-seo-static="true"
      name="twitter:title"
      content="TorkQ — AI Governance Gateway for Regulated Enterprises"
    />
    <meta
      data-seo-static="true"
      name="twitter:description"
      content="TorkQ is an on-premise AI governance gateway that masks PII in prompts before they reach an LLM, controls model access, and logs a tamper-evident audit trail."
    />
    <meta data-seo-static="true" name="twitter:image" content="https://www.torkq.com/og-image.png" />

    <!--
      Organization schema, as the no-JavaScript baseline for the same reason
      the tags above are: a crawler that does not run the bundle still gets it.
      <Seo includeStructuredData> emits this graph plus SoftwareApplication and
      WebSite at runtime, so this block carries data-seo-static too and
      vite/hoist-head.ts drops it from the pre-rendered pages — otherwise the
      homepage would ship two Organization nodes.
    -->
    <script type="application/ld+json" data-seo-static="true">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TorkQ",
        "url": "https://www.torkq.com",
        "logo": "https://www.torkq.com/logo.png",
        "description": "TorkQ builds an on-premise AI governance gateway that masks sensitive data in prompts before they reach a large language model."
      }
    </script>

    <!-- SVG first: browsers that support it get the crisp mark at any size,
         and favicon.ico is the fallback for those that do not. Safari ignores
         SVG for the home-screen tile, so apple-touch-icon has to be raster. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
